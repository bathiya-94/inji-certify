# Overlay the deployment's existing Certify properties; activate the erl profile.
mosip.certify.plugin-mode=DataProvider
mosip.certify.integration.data-provider-plugin=RouterDataProviderPlugin
mosip.certify.integration.data-provider-routing.credential-mapping[ERLCredential]=erl

# Public URLs, also used when the offer is created through the private service.
mosip.certify.domain.url=${CERTIFY_PUBLIC_ORIGIN}
mosip.certify.identifier=${CERTIFY_PUBLIC_ORIGIN}/v1/certify
mosip.certify.credential-offer-url=${mosip.certify.identifier}/credential-offer-data/
mosip.certify.oauth.issuer=${mosip.certify.identifier}
mosip.certify.oauth.access-token.audience=${mosip.certify.identifier}/issuance/credential
mosip.certify.authn.jwk-set-uri=${mosip.certify.identifier}/.well-known/jwks.json

mosip.certify.pre-auth.service-auth.issuer=${ERL_SERVICE_JWT_ISSUER}
mosip.certify.pre-auth.service-auth.jwk-set-uri=${ERL_SERVICE_JWKS_URI}
mosip.certify.pre-auth.service-auth.audience=${ERL_SERVICE_JWT_AUDIENCE}
mosip.certify.pre-auth.service-auth.allowed-clients[ERLCredential]=${ERL_SERVICE_CLIENT_ID}

dmt.datasource.enabled=true
dmt.datasource.url=${DMT_JDBC_URL}
dmt.datasource.username=${DMT_DB_USERNAME}
dmt.datasource.password=${DMT_DB_PASSWORD}
dmt.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
dmt.datasource.hikari.read-only=true
dmt.datasource.hikari.maximum-pool-size=5
dmt.datasource.hikari.connection-timeout=5000
dmt.datasource.hikari.data-source-properties.connectTimeout=5000
dmt.datasource.hikari.data-source-properties.socketTimeout=5000
dmt.erl.enabled=true
dmt.erl.licence-fee-code=${DMT_LICENCE_FEE_CODE}
dmt.erl.arrears-code=${DMT_ARREARS_CODE}
dmt.erl.fines-code=${DMT_FINES_CODE}

spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_TLS_ENABLED:true}
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s
mosip.certify.cache.redis.key-prefix=${CERTIFY_CACHE_PREFIX}
mosip.certify.pre-auth.default-expiry-seconds=600
mosip.certify.pre-auth.max-expiry-seconds=600
mosip.certify.pre-auth.cache-expire-seconds=600
mosip.certify.credential-offer.cache-expire-seconds=600
mosip.certify.oauth.token.expires-in-seconds=600
mosip.certify.access-token-expire-seconds=600
management.health.redis.enabled=true
