# Overlay the deployment's existing Certify properties; activate the erl profile.
mosip.certify.plugin-mode=DataProvider
mosip.certify.integration.data-provider-plugin=RouterDataProviderPlugin
mosip.certify.integration.data-provider-routing.credential-mapping[ERLCredential]=erl

# Public URLs, also used when the offer is created through the private service.
# Credential verification documents are hosted separately from the issuance API.
mosip.certify.data-provider-plugin.did-url=did:web:bathiya-94.github.io:erl-demo-config:issuer
mosip.certify.data-provider-plugin.issuer-public-key-uri=https://bathiya-94.github.io/erl-demo-config/issuer/did.json
mosip.certify.domain.url=${CERTIFY_PUBLIC_ORIGIN}
mosip.certify.identifier=${CERTIFY_PUBLIC_ORIGIN}/v1/certify
mosip.certify.credential-offer-url=${mosip.certify.identifier}/credential-offer-data/
mosip.certify.oauth.issuer=${mosip.certify.identifier}
mosip.certify.oauth.access-token.audience=${mosip.certify.identifier}/issuance/credential
mosip.certify.authn.jwk-set-uri=${mosip.certify.identifier}/.well-known/jwks.json

mosip.certify.pre-auth.service-auth.issuer=${ERL_SERVICE_JWT_ISSUER}
mosip.certify.pre-auth.service-auth.jwk-set-uri=${ERL_SERVICE_JWKS_URI}
mosip.certify.pre-auth.service-auth.audience=${ERL_SERVICE_JWT_AUDIENCE}
mosip.certify.pre-auth.service-auth.allowed-clients[ERLCredential]=${ERL_SERVICE_CLIENT_ID}

# ---- Revocation, status lists and the ledger --------------------------------------------------------------------
# Every licence carries its own id (urn:uuid:...) and a status list entry, so it can be revoked and found again.
mosip.certify.data-provider-plugin.id-field-prefix-uri=urn:uuid:
mosip.certify.issuer.ledger-enabled=true
mosip.certify.data-provider-plugin.credential-status.allowed-status-purposes={'revocation'}
# 64 KiB lists (524,288 positions); a list stops accepting new licences at 50% and the next one is created.
mosip.certify.statuslist.size-in-kb=64
mosip.certify.statuslist.usable-capacity-percentage=50
# Revocations are published every 30 seconds. The lease is shorter than the interval so a node that dies mid-run
# costs at most one run. Verifiers may cache a list for 20 seconds; a list with a change that has waited 90 seconds
# is reported as unavailable instead of being served as current.
mosip.certify.batch.status-list-update.enabled=true
mosip.certify.batch.status-list-update.cron-expression=*/30 * * * * *
mosip.certify.batch.status-list-update.batch-size=1000
mosip.certify.batch.status-list-update.lock-at-least-for=25s
mosip.certify.batch.status-list-update.lock-at-most-for=28s
mosip.certify.status-list.ttl-ms=20000
mosip.certify.status-list.max-unpublished-age-seconds=90

# ---- Ledger search ----------------------------------------------------------------------------------------------
# document_id is the printed licence number (license_no); the DMT row id (licence_id) is not indexed. vehicle_no is native.
# issued_date is stored but not searchable.
mosip.certify.indexed-types[ERLCredential,VerifiableCredential].mappings[document_id]=$.license_no
mosip.certify.indexed-types[ERLCredential,VerifiableCredential].mappings[vehicle_no]=$.vehicle_no
mosip.certify.indexed-types[ERLCredential,VerifiableCredential].mappings[issued_date]=$.issued_date
mosip.certify.indexed-types[ERLCredential,VerifiableCredential].searchable-fields=document_id,vehicle_no
mosip.certify.ledger-search.default-limit=100
mosip.certify.ledger-search.max-limit=1000
mosip.certify.ledger-search.max-offset=10000

# ---- Management: revocation and ledger search ---------------------------------------------------------------------
# Trust is separate from the wallet and pre-authorization settings above. A deployment must never set
# allow-unauthenticated=true; the base local profile does, so this overlay turns it off explicitly.
mosip.certify.management.auth.enabled=true
mosip.certify.management.auth.allow-unauthenticated=false
mosip.certify.management.auth.issuer=${ERL_MANAGEMENT_JWT_ISSUER}
mosip.certify.management.auth.jwk-set-uri=${ERL_MANAGEMENT_JWKS_URI}
mosip.certify.management.auth.audience=${ERL_MANAGEMENT_JWT_AUDIENCE}
mosip.certify.management.auth.allowed-clients=${ERL_MANAGEMENT_CLIENT_ID}
mosip.certify.management.auth.client-id-claim=client_id

dmt.datasource.enabled=true
dmt.datasource.url=${DMT_JDBC_URL}
dmt.datasource.username=${DMT_DB_USERNAME}
dmt.datasource.password=${DMT_DB_PASSWORD}
dmt.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
dmt.datasource.hikari.read-only=true
dmt.datasource.hikari.maximum-pool-size=5
dmt.datasource.hikari.connection-timeout=5000
dmt.datasource.hikari.data-source-properties.connectTimeout=5000
dmt.datasource.hikari.data-source-properties.socketTimeout=5000
dmt.erl.enabled=true
dmt.erl.licence-fee-code=${DMT_LICENCE_FEE_CODE}
dmt.erl.arrears-code=${DMT_ARREARS_CODE}
dmt.erl.fines-code=${DMT_FINES_CODE}

spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_TLS_ENABLED:true}
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s
mosip.certify.cache.redis.key-prefix=${CERTIFY_CACHE_PREFIX}
mosip.certify.pre-auth.default-expiry-seconds=600
mosip.certify.pre-auth.max-expiry-seconds=600
mosip.certify.pre-auth.cache-expire-seconds=600
mosip.certify.credential-offer.cache-expire-seconds=600
mosip.certify.oauth.token.expires-in-seconds=600
mosip.certify.access-token-expire-seconds=600
management.health.redis.enabled=true
